name: webgl-pages

on:
    workflow_call:
        inputs:
            git_ref:
                required: true
                type: string
            publish_kind:
                required: false
                type: string
                default: preview
            release_tag:
                required: false
                type: string
            preview_name:
                required: false
                type: string
        outputs:
            pages_index_url:
                description: Published index page URL
                value: ${{ jobs.publish.outputs.pages_index_url }}
            version_url:
                description: Published URL for the current build
                value: ${{ jobs.publish.outputs.version_url }}
    workflow_dispatch:
        inputs:
            git_ref:
                description: Branch, tag, or commit SHA to build
                required: true
                type: string
            publish_kind:
                description: Publish as a preview or a released version
                required: true
                default: preview
                type: choice
                options:
                    - preview
                    - release
            release_tag:
                description: Release tag to publish under versions/ (required when publish_kind=release)
                required: false
                type: string
            preview_name:
                description: Optional preview label prefix (defaults to git_ref)
                required: false
                type: string

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    PROJECT_PATH: .github/unity-webgl-project
    SITE_PATH: .pages-site
    UNITY_VERSION: 6000.3.11f1
    GIT_REF: ${{ inputs.git_ref || github.event.inputs.git_ref }}
    PUBLISH_KIND: ${{ inputs.publish_kind || github.event.inputs.publish_kind || 'preview' }}
    RELEASE_VERSION: ${{ inputs.release_tag || github.event.inputs.release_tag }}
    PREVIEW_NAME: ${{ inputs.preview_name || github.event.inputs.preview_name }}

jobs:
    publish:
        runs-on: ubuntu-latest
        outputs:
            pages_index_url: ${{ steps.urls.outputs.pages_index_url }}
            version_url: ${{ steps.urls.outputs.version_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ env.GIT_REF }}
                  lfs: true
                  fetch-depth: 0

            - name: Resolve publication target
              id: publish_target
              shell: bash
              run: |
                  set -eu

                  sanitize() {
                      printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._/-]#-#g; s#/#-#g; s#--*#-#g; s#^-##; s#-$##'
                  }

                  publish_kind="${PUBLISH_KIND}"
                  git_ref="${GIT_REF}"
                  release_version="${RELEASE_VERSION}"
                  preview_name="${PREVIEW_NAME}"
                  short_sha="$(git rev-parse --short=8 HEAD)"

                  if [ "$publish_kind" = "release" ]; then
                      if [ -z "$release_version" ]; then
                          echo "release_tag is required when publish_kind=release" >&2
                          exit 1
                      fi
                      publish_path="versions/${release_version}"
                  else
                      if [ -z "$preview_name" ]; then
                          preview_name="$git_ref"
                      fi
                      preview_slug="$(sanitize "$preview_name")"
                      if [ -z "$preview_slug" ]; then
                          echo "preview_name resolved to an empty slug" >&2
                          exit 1
                      fi
                      publish_path="previews/${preview_slug}-${short_sha}"
                  fi

                  echo "publish_path=${publish_path}" >> "$GITHUB_OUTPUT"

            - name: Restore existing site content
              continue-on-error: true
              uses: actions/checkout@v5
              with:
                  ref: gh-pages
                  path: ${{ env.SITE_PATH }}
                  fetch-depth: 1

            - name: Bootstrap temporary Unity project
              shell: bash
              run: |
                  set -eu

                  mkdir -p "$PROJECT_PATH/Assets/Editor"
                  mkdir -p "$PROJECT_PATH/Assets/Samples"
                  mkdir -p "$PROJECT_PATH/Packages"
                  mkdir -p "$PROJECT_PATH/ProjectSettings"
                  mkdir -p "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting"

                  cat > "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt" <<EOF
                  m_EditorVersion: ${UNITY_VERSION}
                  EOF

                  # Keep only the registry packages and built-in modules required by the bootstrap project.
                  cat > "$PROJECT_PATH/Packages/manifest.json" <<EOF
                  {
                    "dependencies": {
                      "com.unity.render-pipelines.universal": "17.3.0",
                      "com.unity.modules.audio": "1.0.0",
                      "com.unity.modules.physics": "1.0.0",
                      "com.unity.modules.uielements": "1.0.0"
                    }
                  }
                  EOF

                  cp "package.json" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/package.json"
                  cp "package.json.meta" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/package.json.meta"
                  cp "README.md" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/README.md"
                  cp "README.md.meta" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/README.md.meta"
                  cp "CHANGELOG.md" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/CHANGELOG.md"
                  cp "CHANGELOG.md.meta" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/CHANGELOG.md.meta"
                  cp "LICENSE" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/LICENSE"
                  cp "LICENSE.meta" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/LICENSE.meta"
                  cp "Editor.meta" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/Editor.meta"
                  cp "Runtime.meta" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/Runtime.meta"
                  rsync -a "Editor/" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/Editor/"
                  rsync -a "Runtime/" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/Runtime/"
                  rsync -a "Samples~/" "$PROJECT_PATH/Packages/com.lotecsoftware.voxel-lighting/Samples~/"

                  rsync -a "Samples~/Usage samples/" "$PROJECT_PATH/Assets/Samples/Usage samples/"
                  cp ".github/unity/BuildWebGlSample.cs" "$PROJECT_PATH/Assets/Editor/BuildWebGlSample.cs"

            - name: Cache Library
              uses: actions/cache@v4
              with:
                  path: ${{ env.PROJECT_PATH }}/Library
                  key: Library-WebGL-${{ env.GIT_REF }}-${{ hashFiles('.github/workflows/webgl-pages.yml', '.github/workflows/webgl-release.yml', '.github/unity/BuildWebGlSample.cs', 'package.json', 'Runtime/**', 'Editor/**', 'Samples~/**') }}
                  restore-keys: |
                      Library-WebGL-

            - name: Build WebGL sample
              uses: game-ci/unity-builder@v4
              env:
                  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
                  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
                  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
              with:
                  projectPath: ${{ env.PROJECT_PATH }}
                  targetPlatform: WebGL
                  unityVersion: ${{ env.UNITY_VERSION }}
                  buildMethod: BuildWebGlSample.Build
                  allowDirtyBuild: true

            - name: Prepare versioned Pages site
              shell: bash
              env:
                  PUBLISH_PATH: ${{ steps.publish_target.outputs.publish_path }}
              run: |
                  set -eu

                  mkdir -p "$SITE_PATH"
                  rm -rf "$SITE_PATH/.git"
                  mkdir -p "$SITE_PATH/$PUBLISH_PATH"
                  mkdir -p "$SITE_PATH/versions"
                  mkdir -p "$SITE_PATH/previews"

                  rsync -a --delete "$PROJECT_PATH/build/WebGL/" "$SITE_PATH/$PUBLISH_PATH/"
                  if [ "$PUBLISH_KIND" = "release" ]; then
                      rsync -a --delete "$PROJECT_PATH/build/WebGL/" "$SITE_PATH/latest/"
                  fi
                  touch "$SITE_PATH/.nojekyll"

                  mapfile -t versions < <(find "$SITE_PATH/versions" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -rV)
                  mapfile -t previews < <(find "$SITE_PATH/previews" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

                  {
                      echo '<!doctype html>'
                      echo '<html lang="en">'
                      echo '<head>'
                      echo '  <meta charset="utf-8">'
                      echo '  <meta name="viewport" content="width=device-width, initial-scale=1">'
                      echo '  <title>Lotec Voxel Lighting WebGL Builds</title>'
                      echo '  <style>'
                      echo '    :root { color-scheme: light; }'
                      echo '    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: linear-gradient(180deg, #f6f1e8 0%, #e7eef5 100%); color: #1e2430; }'
                      echo '    main { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }'
                      echo '    h1 { font-size: 2.5rem; margin: 0 0 12px; }'
                      echo '    p { font-size: 1.05rem; line-height: 1.6; max-width: 60ch; }'
                      echo '    .card { margin-top: 28px; padding: 24px; border-radius: 18px; background: rgba(255,255,255,0.72); box-shadow: 0 16px 40px rgba(39, 55, 77, 0.14); backdrop-filter: blur(10px); }'
                      echo '    .latest { display: inline-block; margin: 8px 0 24px; padding: 12px 18px; border-radius: 999px; background: #1e2430; color: #fff; text-decoration: none; }'
                      echo '    ul { list-style: none; padding: 0; margin: 0; }'
                      echo '    li + li { margin-top: 12px; }'
                      echo '    a.version-link { color: #0b5fff; text-decoration: none; font-weight: 700; }'
                      echo '  </style>'
                      echo '</head>'
                      echo '<body>'
                      echo '  <main>'
                      echo '    <h1>Lotec Voxel Lighting</h1>'
                      echo '    <p>Web builds for the Playground sample scene. Release builds are published from GitHub releases, and preview builds are published manually from a selected branch or commit with the short SHA in the URL.</p>'
                      if [ -d "$SITE_PATH/latest" ]; then
                          echo '    <a class="latest" href="latest/">Open latest release build</a>'
                      fi
                      echo '    <section class="card">'
                      echo '      <h2>Released versions</h2>'
                      echo '      <ul>'
                      for version in "${versions[@]}"; do
                          echo "        <li><a class=\"version-link\" href=\"versions/${version}/\">${version}</a></li>"
                      done
                      echo '      </ul>'
                      echo '    </section>'
                      echo '    <section class="card">'
                      echo '      <h2>Preview builds</h2>'
                      echo '      <ul>'
                      for preview in "${previews[@]}"; do
                          echo "        <li><a class=\"version-link\" href=\"previews/${preview}/\">${preview}</a></li>"
                      done
                      echo '      </ul>'
                      echo '    </section>'
                      echo '  </main>'
                      echo '</body>'
                      echo '</html>'
                  } > "$SITE_PATH/index.html"

            - name: Compute published URLs
              id: urls
              shell: bash
              env:
                  PUBLISH_PATH: ${{ steps.publish_target.outputs.publish_path }}
              run: |
                  set -eu
                  repo_name="${GITHUB_REPOSITORY#*/}"
                  base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
                  echo "pages_index_url=${base_url}/" >> "$GITHUB_OUTPUT"
                  echo "version_url=${base_url}/${PUBLISH_PATH}/" >> "$GITHUB_OUTPUT"

            - name: Publish to gh-pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ${{ env.SITE_PATH }}
                  force_orphan: false
