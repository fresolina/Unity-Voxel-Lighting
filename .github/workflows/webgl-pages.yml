name: webgl-pages

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string
      publish_kind:
        required: false
        type: string
        default: preview
      release_tag:
        required: false
        type: string
      preview_name:
        required: false
        type: string
    outputs:
      pages_index_url:
        description: Published index page URL
        value: ${{ jobs.publish.outputs.pages_index_url }}
      version_url:
        description: Published URL for the current build
        value: ${{ jobs.publish.outputs.version_url }}
  workflow_dispatch:
    inputs:
      git_ref:
        description: Optional branch, tag, or commit SHA to build. Defaults to the branch selected when you run the workflow.
        required: false
        type: string
      publish_kind:
        description: Publish as a preview or a released version
        required: true
        default: preview
        type: choice
        options:
          - preview
          - release
      release_tag:
        description: Release tag to publish under versions/ (defaults to the latest CHANGELOG.md version when publish_kind=release)
        required: false
        type: string
      preview_name:
        description: Optional preview label prefix (defaults to git_ref)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: BootstrapProject~
  SITE_PATH: .pages-site
  UNITY_VERSION: 6000.3.1f1
  GIT_REF: ${{ inputs.git_ref || github.event.inputs.git_ref || github.ref_name }}
  PUBLISH_KIND: ${{ inputs.publish_kind || github.event.inputs.publish_kind || 'preview' }}
  RELEASE_VERSION: ${{ inputs.release_tag || github.event.inputs.release_tag }}
  PREVIEW_NAME: ${{ inputs.preview_name || github.event.inputs.preview_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      pages_index_url: ${{ steps.urls.outputs.pages_index_url }}
      version_url: ${{ steps.urls.outputs.version_url }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          android: true
          haskell: true
          dotnet: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.GIT_REF }}
          lfs: true
          fetch-depth: 0

      - name: Resolve publication target
        id: publish_target
        shell: bash
        run: |
          set -eu

          sanitize() {
              printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._/-]#-#g; s#/#-#g; s#--*#-#g; s#^-##; s#-$##'
          }

          publish_kind="${PUBLISH_KIND}"
          git_ref="${GIT_REF}"
          release_version="${RELEASE_VERSION}"
          preview_name="${PREVIEW_NAME}"
          short_sha="$(git rev-parse --short=8 HEAD)"
          preview_label=""
          preview_slug=""

          if [ "$publish_kind" = "release" ]; then
              if [ -z "$release_version" ]; then
                release_version="$(sed -nE 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+)\]?.*/v\1/p' CHANGELOG.md | head -n 1)"
                if [ -z "$release_version" ]; then
                  echo "release_tag was not provided and no release version could be inferred from CHANGELOG.md" >&2
                  exit 1
                fi
              fi
              publish_path="versions/${release_version}"
          else
              if [ -z "$preview_name" ]; then
                  preview_name="$git_ref"
              fi
              preview_slug="$(sanitize "$preview_name")"
              if [ -z "$preview_slug" ]; then
                  echo "preview_name resolved to an empty slug" >&2
                  exit 1
              fi
              publish_path="previews/${preview_slug}"
              preview_label="${preview_name} (${short_sha})"
          fi

          echo "publish_path=${publish_path}" >> "$GITHUB_OUTPUT"
          echo "preview_label=${preview_label}" >> "$GITHUB_OUTPUT"
          echo "preview_slug=${preview_slug}" >> "$GITHUB_OUTPUT"

      - name: Restore existing site content
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: ${{ env.SITE_PATH }}
          fetch-depth: 1

      - name: Resolve package metadata
        id: package_metadata
        shell: bash
        run: |
          set -eu
          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap temporary Unity project
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.package_name }}
        run: |
          set -eu

          cat > "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt" <<EOF
          m_EditorVersion: ${UNITY_VERSION}
          EOF

          mv "Samples~" "Samples"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles(
            format('{0}/Packages/manifest.json', env.PROJECT_PATH),
            format('{0}/Assets/Editor/BuildWebGlSample.cs', env.PROJECT_PATH)
            ) }}

      - name: Build WebGL sample
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: WebGL
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildWebGlSample.Build
          allowDirtyBuild: true

      - name: Prepare versioned Pages site
        shell: bash
        env:
          PUBLISH_PATH: ${{ steps.publish_target.outputs.publish_path }}
          PREVIEW_LABEL: ${{ steps.publish_target.outputs.preview_label }}
          PREVIEW_SLUG: ${{ steps.publish_target.outputs.preview_slug }}
        run: |
          bash .github/scripts/prepare-pages-site.sh

      - name: Compute published URLs
        id: urls
        shell: bash
        env:
          PUBLISH_PATH: ${{ steps.publish_target.outputs.publish_path }}
        run: |
          set -eu
          repo_name="${GITHUB_REPOSITORY#*/}"
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          echo "pages_index_url=${base_url}/" >> "$GITHUB_OUTPUT"
          echo "version_url=${base_url}/${PUBLISH_PATH}/" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        shell: bash
        env:
          PAGES_INDEX_URL: ${{ steps.urls.outputs.pages_index_url }}
          VERSION_URL: ${{ steps.urls.outputs.version_url }}
          PUBLISH_KIND_VALUE: ${{ env.PUBLISH_KIND }}
          PREVIEW_LABEL: ${{ steps.publish_target.outputs.preview_label }}
        run: |
          set -eu
          printf '## WebGL Pages\n\n- Pages index: %s\n- Published build: %s\n' "$PAGES_INDEX_URL" "$VERSION_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH_KIND_VALUE" = "preview" ] && [ -n "$PREVIEW_LABEL" ]; then
              printf -- '- Preview label: %s\n' "$PREVIEW_LABEL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ env.SITE_PATH }}
          force_orphan: false
