name: webgl-release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-webgl-pages:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    uses: ./.github/workflows/webgl-pages.yml
    with:
      git_ref: ${{ github.event.pull_request.merge_commit_sha }}
      publish_kind: release
    secrets: inherit

  annotate-release:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update release body with Pages links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        shell: bash
        run: |
          set -eu
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_index_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/"
          version_url="${pages_index_url}versions/${RELEASE_TAG}/"
          notes_file="$(mktemp)"
          printf '%s\n\nWebGL build:\n- Current release: %s\n- All released builds: %s\n' "$RELEASE_BODY" "$version_url" "$pages_index_url" > "$notes_file"
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --notes-file "$notes_file"
